<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
      <div class="nav-navigation">
        <div class="nav-menu-logo">
          <div class="nav-menu-icon icons"><i class="fa-solid fa-bars"></i></div>
          <div class="nav-logo"></div>
        </div>
        <div class="nav-icons">
          <div class="nav-email icons"><i class="fa-solid fa-envelope"></i></div>
          <div class="nav-user icons"><i class="fa-solid fa-user"></i></div>
          <div class="nav-cart icons"><i class="fa-solid fa-cart-shopping"></i></div>
        </div>
      </div>
      <div class="nav-searchbar">
        <input type="text" name="search" id="search" placeholder="What are you looking for?" />
        <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </nav>
    <div class="hero">
      <div class="hero-frame">
        <img class="hero-phone-logo" src="/assets/hero-phone-logo.webp">
        <h2 class="hero-phone-tagline">max every move</h2>
        <div class="hero-phone-info-box">
          <p class="hero-phone-info-box-firstline">unmatched performance </p>
          <p>Snapdragon® 8 Gen 5</p>
        </div>
        <div class="hero-phone-info-box">
          <p class="hero-phone-info-box-firstline">immersive Quad HD+ display</p>
          <p>7000 nits brightness</p>
        </div>
        <div class="hero-phone-info-price">
          <p class="hero-phone-info-box-firstline">Starts at 49,999*</p>
        </div>
        <div class="hero-phone-info-buynow">
          <button class="hero-phone-info-box-buynowbtn" type="submit">Buy Now</button>
        </div>
      </div>
    </div>
  </header>
</body>

</html>
